services:
  - type: web
    name: gradua-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_URL
        fromDatabase:
          name: gradua-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: gradua-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gradua-db
          property: password
      - key: API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://gradua.vercel.app,http://localhost:5173,http://localhost:3000
    healthCheckPath: /actuator/health
    autoDeploy: true

databases:
  - name: gradua-db
    databaseName: gradua
    user: gradua
    plan: free