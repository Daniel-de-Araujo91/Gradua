spring.application.name=gradua
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

logging.level.org.springframework.core.env=INFO
logging.level.org.springframework.boot.context.config=INFO

# ──────────────────────────────────────────────
# PostgreSQL DataSource
# ──────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.lob.non_contextual_creation=true

# ──────────────────────────────────────────────
# Segurança JWT
# ──────────────────────────────────────────────
api.security.token.secret=${API_KEY:dev_default_api_key_change_me}


spring.jpa.open-in-view=false